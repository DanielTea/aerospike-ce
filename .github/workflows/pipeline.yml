name: pipeline

# The gate, run the same way a person runs it. `pipeline.py` decides what
# passes; this file only decides when.
#
# Screening depth, because the print voxel takes about an hour a part and CI is
# not where that belongs. What screening depth proves is closure, connectivity,
# orientation and the whole suite; what it does not prove is the genus, and the
# pipeline says so itself rather than asserting it at a resolution that cannot
# support it. The print-depth run is the release gate and lives in
# docs/pipeline/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A branch push and its pull request are the same commit; running the gate
# twice on it proves nothing twice. Superseded runs are cancelled rather than
# left to finish, because the answer they would give is about a commit nobody
# is looking at any more.
concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: validate/requirements.txt

      - name: install
        run: pip install -r validate/requirements.txt

      - name: pipeline
        working-directory: validate
        run: python pipeline.py --depth screen --json ../out/pipeline.json

      - name: report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: out/pipeline.json
          if-no-files-found: warn
